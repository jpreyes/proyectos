server {
    listen 80;
    server_name _;

    # Subida de adjuntos a PocketBase.
    client_max_body_size 50m;

    # El panel de administración de la base NO sale a internet.
    #
    # Estaba publicado: https://tda.jpreyes.cl/_/ respondía a cualquiera. La
    # contraseña lo protegía, pero deja expuesta la superficie más sensible del
    # sistema —esquema, datos crudos, respaldos, creación de superusuarios— a
    # fuerza bruta y a cualquier fallo futuro de PocketBase.
    #
    # Se bloquean dos cosas, no una: el panel y la autenticación de
    # superusuarios. Bloquear solo el panel dejaría la puerta igual de abierta,
    # porque el panel no es más que un cliente de esa API.
    #
    # Para administrar, un túnel SSH contra el puerto que docker-compose.vps.yml
    # publica en 127.0.0.1:
    #
    #     ssh -L 8095:127.0.0.1:8095 root@srv1134838.hstgr.cloud
    #     → http://127.0.0.1:8095/_/
    #
    # (8095 y no 8090: ese ya lo ocupa `pb-proj1` en este box.)
    #
    # `^~` gana a las expresiones regulares de más abajo, así que estos dos
    # bloques mandan aunque el reparto general también calce.
    location ^~ /_/ {
        return 404;
    }
    location = /_ {
        return 404;
    }
    location ^~ /api/collections/_superusers/ {
        return 404;
    }

    # Mismo reparto que el ingress de cloudflared/config.example.yml:
    # PocketBase se queda con /api/* y /_/*. El paréntesis (/|$) exige que el
    # segmento del guión bajo termine ahí, así /_next/* sigue yendo a Next.
    location ~ ^/(api|_)(/|$) {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # /api/realtime es SSE.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 5m;
    }
}
