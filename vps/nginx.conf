server {
    listen 80;
    server_name _;

    # Subida de adjuntos a PocketBase.
    client_max_body_size 50m;

    # Mismo reparto que el ingress de cloudflared/config.example.yml:
    # PocketBase se queda con /api/* y /_/*. El paréntesis (/|$) exige que el
    # segmento del guión bajo termine ahí, así /_next/* sigue yendo a Next.
    location ~ ^/(api|_)(/|$) {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # /api/realtime es SSE.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 5m;
    }
}
